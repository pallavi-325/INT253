<!-- CareNest Navbar Component -->
<nav class="sticky top-0 z-40 bg-white/95 dark:bg-slate-850/95 backdrop-blur border-b border-slate-200 dark:border-slate-800 transition-colors">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        
        <!-- Brand Logo -->
        <div class="flex items-center space-x-6">
            <a href="{% url 'home' %}" class="flex items-center space-x-3 group">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-teal-700 to-teal-500 text-white flex items-center justify-center font-bold shadow-md shadow-teal-600/20 group-hover:scale-105 transition-transform">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
                    </svg>
                </div>
                <div>
                    <span class="text-xl font-extrabold tracking-tight text-slate-900 dark:text-white">Care<span class="text-teal-600 dark:text-teal-400">Nest</span></span>
                    <span class="hidden md:inline-block text-[11px] uppercase tracking-wider text-teal-700 dark:text-teal-400 font-semibold ml-2 px-2 py-0.5 rounded-full bg-teal-50 dark:bg-teal-950/60 border border-teal-200 dark:border-teal-800">Pediatric Teledermatology</span>
                </div>
            </a>

            <!-- Public Links -->
            <div class="hidden md:flex items-center space-x-4 text-sm font-medium text-slate-600 dark:text-slate-300">
                <a href="{% url 'home' %}#how-it-works" class="hover:text-teal-600 dark:hover:text-teal-400 transition-colors">How It Works</a>
                <a href="{% url 'home' %}#services" class="hover:text-teal-600 dark:hover:text-teal-400 transition-colors">Treatable Conditions</a>
                <a href="{% url 'home' %}#safety" class="hover:text-teal-600 dark:hover:text-teal-400 transition-colors">Safety Standards</a>
            </div>
        </div>

        <!-- Right Action Items -->
        <div class="flex items-center space-x-3">
            <!-- Dark / Light Theme Toggle -->
            <button id="theme-toggle" type="button" aria-label="Toggle dark/light theme" class="p-2 rounded-xl text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
                </svg>
                <svg id="theme-toggle-light-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path>
                </svg>
            </button>

            {% if user.is_authenticated %}
                <!-- Logged in State -->
                <div class="flex items-center space-x-3">
                    <a href="{% url 'accounts:dashboard_redirect' %}" class="inline-flex items-center px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-teal-600 hover:bg-teal-700 text-white shadow-sm transition-colors">
                        {% if user.is_doctor %}
                            Clinician Portal
                        {% elif user.is_parent %}
                            Parent Dashboard
                        {% else %}
                            Admin Portal
                        {% endif %}
                    </a>
                    <form method="post" action="{% url 'accounts:logout' %}" class="inline">
                        {% csrf_token %}
                        <button type="submit" class="text-xs font-medium text-slate-500 hover:text-rose-600 dark:text-slate-400 dark:hover:text-rose-400 transition-colors">
                            Sign Out
                        </button>
                    </form>
                </div>
            {% else %}
                <!-- Guest State -->
                <div class="flex items-center space-x-2">
                    <a href="{% url 'accounts:login' %}" class="px-3.5 py-2 text-xs font-semibold text-slate-700 dark:text-slate-300 hover:text-teal-600 dark:hover:text-teal-400 transition-colors">
                        Sign In
                    </a>
                    <a href="{% url 'accounts:register_parent' %}" class="px-4 py-2 rounded-xl text-xs font-semibold bg-teal-600 hover:bg-teal-700 text-white shadow-sm shadow-teal-600/20 transition-all hover:scale-[1.02]">
                        Get Started
                    </a>
                </div>
            {% endif %}
        </div>
    </div>
</nav>
