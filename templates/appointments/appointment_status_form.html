{% extends "base.html" %}

{% block title %}Update Case Status – CareNest{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-8">
    <div class="bg-white dark:bg-slate-850 rounded-2xl shadow-xl shadow-slate-200/50 dark:shadow-none border border-slate-200 dark:border-slate-800 p-8 space-y-6">
        <div>
            <a href="{% url 'appointments:appointment_detail' object.id %}" class="text-xs font-semibold text-teal-600 dark:text-teal-400 hover:underline">
                ← Back to Case
            </a>
            <h1 class="text-2xl font-bold text-slate-900 dark:text-white mt-1">Update Status</h1>
            <p class="text-xs text-slate-500 dark:text-slate-400">Patient: {{ object.child.full_name }}</p>
        </div>

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Appointment Status</label>
                {{ form.status }}
            </div>

            <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-200 dark:border-slate-800">
                <a href="{% url 'appointments:appointment_detail' object.id %}" class="px-4 py-2 rounded-xl border border-slate-300 dark:border-slate-700 text-xs font-semibold text-slate-700 dark:text-slate-300">
                    Cancel
                </a>
                <button type="submit" class="px-5 py-2 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-bold text-xs shadow-md">
                    Save Status
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
